services:
  - type: web
    name: multi-agent-vision-decision
    runtime: docker
    healthCheckPath: /
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: YOLO_WEIGHTS
        value: yolov8n.pt
